<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>Arabic Word Card</title>
<style>
  :root{
    --bg:#0b1220;
    --surface:#131c31;
    --surface2:#1e293b;
    --line:#243349;
    --text:#e6edf7;
    --muted:#8b9bb4;
    --primary:#4f8cff;
    --primary2:#3b6fe0;
    --radius:18px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
  }
  #app{max-width:520px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column}

  /* Top bar */
  .top{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:24px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{font-size:1.6rem}
  .brand h1{font-size:1rem;margin:0;font-weight:700}
  .counter{
    background:var(--surface);border:1px solid var(--line);
    padding:6px 12px;border-radius:99px;font-size:.82rem;
    color:var(--muted);font-weight:600;
  }

  /* Card */
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:36px 24px;
    box-shadow:var(--shadow);text-align:center;
    margin-bottom:20px;flex:1;display:flex;flex-direction:column;
    justify-content:center;min-height:340px;
  }
  .arabic{
    font-size:4rem;line-height:1.3;direction:rtl;
    font-family:"Amiri","Scheherazade","Traditional Arabic",serif;
    margin-bottom:10px;
  }
  .translit{
    color:var(--muted);font-size:1.05rem;font-style:italic;
    margin-bottom:20px;
  }
  .meaning{
    font-size:1.5rem;font-weight:800;color:var(--text);
    padding-top:20px;border-top:1px dashed var(--line);
  }

  /* Controls */
  .controls{display:flex;flex-direction:column;gap:12px}
  .btn{
    width:100%;padding:16px;border:none;border-radius:14px;
    font-size:1rem;font-weight:700;cursor:pointer;
    font-family:inherit;transition:transform .08s,filter .15s;
    letter-spacing:.2px;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{
    background:linear-gradient(180deg,var(--primary),var(--primary2));
    color:#fff;box-shadow:0 8px 22px rgba(79,140,255,.35);
  }
  .row{display:flex;gap:10px}
  .btn.secondary{
    background:var(--surface);border:1px solid var(--line);
    color:var(--text);flex:1;
  }
  .btn.secondary:disabled{opacity:.35;cursor:not-allowed}

  .note{
    text-align:center;color:var(--muted);font-size:.8rem;
    margin-top:20px;opacity:.8;
  }
</style>
</head>
<body>
<div id="app">

  <div class="top">
    <div class="brand">
      <span class="logo">﷽</span>
      <h1>Arabic Word Card</h1>
    </div>
    <div class="counter" id="counter">1 / 5</div>
  </div>

  <div class="card">
    <div class="arabic" id="arabic">—</div>
    <div class="translit" id="translit">—</div>
    <div class="meaning" id="meaning">—</div>
  </div>

  <div class="controls">
    <button class="btn primary" id="playBtn">🔊 Listen</button>
    <div class="row">
      <button class="btn secondary" id="prevBtn">← Previous</button>
      <button class="btn secondary" id="nextBtn">Next →</button>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
/* =========================================================
   Function 1: Word Card Display
   Ek lafz dikhao + audio + meaning + next/previous
   ========================================================= */

/* --- Data: 5 sample words --- */
const WORDS = [
  { arabic:'كِتَاب',  translit:'kitāb',  meaning:'book'  },
  { arabic:'قَلَم',   translit:'qalam',  meaning:'pen'   },
  { arabic:'بَاب',    translit:'bāb',    meaning:'door'  },
  { arabic:'مَاء',    translit:'mā’',    meaning:'water' },
  { arabic:'نَار',    translit:'nār',    meaning:'fire'  }
];

/* --- State --- */
let currentIndex = 0;

/* --- DOM --- */
const $arabic   = document.getElementById('arabic');
const $translit = document.getElementById('translit');
const $meaning  = document.getElementById('meaning');
const $counter  = document.getElementById('counter');
const $playBtn  = document.getElementById('playBtn');
const $prevBtn  = document.getElementById('prevBtn');
const $nextBtn  = document.getElementById('nextBtn');
const $note     = document.getElementById('note');

/* --- Render the current word --- */
function renderWord(){
  const w = WORDS[currentIndex];
  $arabic.textContent   = w.arabic;
  $translit.textContent = w.translit;
  $meaning.textContent  = w.meaning;
  $counter.textContent  = (currentIndex+1) + ' / ' + WORDS.length;

  $prevBtn.disabled = currentIndex === 0;
  $nextBtn.disabled = currentIndex === WORDS.length - 1;
}

/* --- Play audio of current word --- */
function playWord(){
  const w = WORDS[currentIndex];
  if(!('speechSynthesis' in window)){
    $note.textContent = '⚠️ Is browser mein audio support nahi hai.';
    return;
  }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w.arabic);
    u.lang = 'ar-SA';
    u.rate = 0.85;
    const voices = speechSynthesis.getVoices();
    const arVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
    if(arVoice) u.voice = arVoice;
    speechSynthesis.speak(u);
    $note.textContent = '';
  }catch(e){
    $note.textContent = '⚠️ Audio play nahi ho saka.';
  }
}

/* --- Navigation --- */
function next(){ if(currentIndex < WORDS.length-1){ currentIndex++; renderWord(); } }
function prev(){ if(currentIndex > 0){ currentIndex--; renderWord(); } }

/* --- Events --- */
$playBtn.addEventListener('click', playWord);
$nextBtn.addEventListener('click', next);
$prevBtn.addEventListener('click', prev);

/* --- Boot --- */
(function boot(){
  // Preload voices (some browsers need a small nudge)
  if('speechSynthesis' in window){
    try{ speechSynthesis.getVoices(); }catch(e){}
    speechSynthesis.onvoiceschanged = function(){
      try{ speechSynthesis.getVoices(); }catch(e){}
    };
  }
  renderWord();
})();
</script>
</body>
</html>
